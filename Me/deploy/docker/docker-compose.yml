version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_pw}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
    ports: ["6379:6379"]

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports: ["2181:2181"]

  kafka:
    image: bitnami/kafka:3.7
    depends_on: [zookeeper]
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]

  gateway:
    build: ../../backend/services/gateway
    environment:
      ENV: ${ENV:-local}
    ports: ["8080:8080"]
    volumes: ["../../backend/common:/app/backend/common"]
    env_file: ["../../backend/.env.example"]

  auth:
    build: ../../backend/services/auth
    environment:
      ENV: ${ENV:-local}
    ports: ["8081:8081"]
    volumes: ["../../backend/common:/app/backend/common"]
    env_file: ["../../backend/.env.example"]

  patient_flow:
    build: ../../backend/services/patient_flow
    environment:
      ENV: ${ENV:-local}
    ports: ["8082:8082"]
    volumes: ["../../backend/common:/app/backend/common"]
    env_file: ["../../backend/.env.example"]

  cds:
    build: ../../backend/services/cds
    environment:
      ENV: ${ENV:-local}
    ports: ["8083:8083"]
    volumes: ["../../backend/common:/app/backend/common"]
    env_file: ["../../backend/.env.example"]

  web:
    working_dir: /app
    image: node:20
    command: sh -c "npm ci && npm run dev"
    ports: ["5173:5173"]
    volumes:
      - ../../frontend/web:/app
    depends_on: [gateway]

volumes:
  pgdata:


  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
