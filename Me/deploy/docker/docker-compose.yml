# Local development stack.
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# All backend images share the "backend/" build context so that the
# "backend.common" package resolves inside the container.

x-backend-build: &backend-build
  context: ../../backend

x-backend-env: &backend-env
  ENV: ${ENV:-local}
  JWT_SECRET: ${JWT_SECRET:-change-this-in-prod}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-medicore}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_pw}
  POSTGRES_DB: ${POSTGRES_DB:-medicore}
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  KAFKA_BROKERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_pw}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore} -d ${POSTGRES_DB:-medicore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    # A single-node replica set: retryable writes and transactions require one,
    # and it keeps local behaviour consistent with production.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
    healthcheck:
      # Initiates the replica set on first run, then reports readiness.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports: ["2181:2181"]

  kafka:
    image: bitnami/kafka:3.7
    depends_on: [zookeeper]
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      # bitnami images require the KAFKA_CFG_ prefix for listener settings.
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  gateway:
    build:
      <<: *backend-build
      dockerfile: services/gateway/Dockerfile
    environment: *backend-env
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  auth:
    build:
      <<: *backend-build
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *backend-env
      SESSION_SECRET: ${SESSION_SECRET:-dev-change-me}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8081/oidc/callback}
    ports: ["8081:8081"]
    depends_on:
      jaeger:
        condition: service_started

  patient_flow:
    build:
      <<: *backend-build
      dockerfile: services/patient_flow/Dockerfile
    environment:
      <<: *backend-env
      BED_LAYOUT: ${BED_LAYOUT:-A:8,B:8,ICU:4}
    ports: ["8082:8082"]
    depends_on:
      mongo:
        condition: service_healthy

  cds:
    build:
      <<: *backend-build
      dockerfile: services/cds/Dockerfile
    environment: *backend-env
    ports: ["8083:8083"]
    depends_on:
      jaeger:
        condition: service_started

  web:
    image: node:20
    working_dir: /app
    # "npm ci" requires a lockfile; fall back to "npm install" when absent.
    command: sh -c "npm ci || npm install; npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ../../frontend/web:/app
      # Keep container-built node_modules off the host bind mount.
      - web_node_modules:/app/node_modules
    depends_on: [gateway]

volumes:
  pgdata:
  mongodata:
  web_node_modules:
