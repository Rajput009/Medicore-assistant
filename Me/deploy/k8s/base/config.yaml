apiVersion: v1
kind: ConfigMap
metadata:
  name: medicore-config
  namespace: medicore
data:
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "medicore"
  # replicaSet + retryWrites required for multi-document transactions and
  # retryable writes. Single-node RS is fine; match the compose topology.
  MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&retryWrites=true&w=majority"
  MONGO_DB: "medicore"
  KAFKA_BROKERS: "kafka:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  OTEL_SERVICE_NAMESPACE: "medicore"
  # Browser origins allowed to call the API with credentials. Never "*".
  ALLOWED_ORIGINS: "https://console.medicore.local"
  # Host header allow-list (comma-separated). Required in production.
  TRUSTED_HOSTS: "api.medicore.local,localhost"
  # Short-lived access tokens limit blast radius of a stolen JWT.
  ACCESS_TOKEN_TTL_MINUTES: "15"
  # Interactive OpenAPI docs stay off in production.
  EXPOSE_API_DOCS: "false"
  ENABLE_DEMO_LOGIN: "false"
  ENABLE_HSTS: "true"
  RATE_LIMIT_PER_MINUTE: "120"
  LOGIN_RATE_LIMIT_PER_MINUTE: "10"
  AUDIT_LOG_RAW_IDENTIFIERS: "false"
  # Queryable audit index (Postgres). Writes are queued off the request path;
  # alert on the dropped/failed counters exposed by GET /audit/stats.
  AUDIT_INDEX_ENABLED: "true"
  # Six-year retention per HIPAA 164.316(b)(2)(i).
  AUDIT_RETENTION_DAYS: "2555"
  # Shared rate-limit + token denylist across replicas.
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AUTH_SET_COOKIE: "true"
  AUTH_COOKIE_NAME: "medicore_session"
---
# NOTE: the medicore-secrets Secret is deliberately NOT defined here.
#
# Committing a placeholder invites it being filled in and pushed. Create it
# out-of-band with sealed-secrets, External Secrets Operator, or your cloud
# secret manager. Required keys:
#
#   jwt-secret          >= 32 random chars  (openssl rand -hex 32)
#   session-secret      >= 32 random chars
#   postgres-password   >= 12 chars
#   fhir-client-secret  from your EHR vendor
#   oidc-client-secret  from your IdP
#   oidc-client-id      from your IdP
#   oidc-issuer         https://idp.example/realms/medicore
#
# Services refuse to start in production if any of these is a placeholder,
# if TRUSTED_HOSTS is empty, if demo login is enabled, or if OIDC is missing.
