apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicore-ingress
  namespace: medicore
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.medicore.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
