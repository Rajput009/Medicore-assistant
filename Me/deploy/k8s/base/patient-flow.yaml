apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-flow
  namespace: medicore
  labels: { app: patient-flow }
spec:
  replicas: 2
  # Never drop below full capacity during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: patient-flow }
  template:
    metadata:
      labels: { app: patient-flow }
    spec:
      # Allow in-flight requests to finish before the container is killed.
      terminationGracePeriodSeconds: 30
      # Spread replicas so a single node failure cannot take out the service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: patient-flow }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patient-flow
          image: medicore/patient-flow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: ENV
              value: "prod"
            # Secrets come from a Secret, never from plain env values.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: medicore-secrets, key: jwt-secret }
          envFrom:
            - configMapRef: { name: medicore-config }
          # Without probes, Kubernetes routes traffic to pods that are still
          # starting up or already wedged.
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # /ready verifies dependencies, so a pod with a dead database is
            # removed from the Service instead of blackholing traffic.
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: patient-flow
  namespace: medicore
spec:
  selector:
    app: patient-flow
  ports:
    - name: http
      port: 8082
      targetPort: http
