[tool.poetry]
name = "medicore-backend"
version = "0.1.0"
description = "MediCore backend services"
authors = ["You <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
# The cryptography extra is required for RS/ES (JWKS) verification.
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = "^1.7.4"
bcrypt = "^4.1.2"
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
pymongo = "^4.8.0"
motor = "^3.5.0"
redis = "^5.0.4"
aiokafka = "^0.10.0"
httpx = "^0.27.0"
loguru = "^0.7.2"
authlib = "^1.3.1"
itsdangerous = "^2.2.0"
python-multipart = "^0.0.9"
opentelemetry-api = "^1.26.0"
opentelemetry-sdk = "^1.26.0"
opentelemetry-exporter-otlp-proto-http = "^1.26.0"
opentelemetry-instrumentation-fastapi = "^0.47b0"
opentelemetry-instrumentation-httpx = "^0.47b0"
opentelemetry-instrumentation-logging = "^0.47b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
black = "^24.4.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
types-requests = "^2.32.0.20240602"
# Real PostgreSQL binary (no Docker) for cache integration tests.
pgserver = "^0.1.4"
# In-process MongoDB wire-semantics engine used by repository tests.
mongomock-motor = "^0.0.34"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # `Depends(...)`/`Query(...)` in defaults is the documented FastAPI idiom.
    "B008",
]

[tool.black]
line-length = 100
target-version = ["py311"]
